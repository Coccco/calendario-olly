<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10261b">
  <title>Calendario dell'avvento</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Per Olly">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261128a">
</head>
<body>
  <div class="snow" aria-hidden="true"></div>
  <div class="branch left" aria-hidden="true"></div>
  <div class="branch right" aria-hidden="true"></div>

  <!-- Schermata 1: il pacchetto da aprire -->
  <main id="intro" class="screen intro">
    <p class="kicker">Dicembre è arrivato</p>
    <h1 class="intro-title">C'è qualcosa<br><em>per te</em></h1>

    <button id="gift" class="gift" type="button" aria-label="Apri il pacchetto">
      <span class="gift-glow"></span>
      <span class="gift-box"><span class="tag" id="tag-name">Olly</span></span>
      <span class="gift-lid"></span>
      <span class="gift-bow" data-bow></span>
    </button>
    <p class="hint" id="gift-hint">Tocca il fiocco per aprire</p>

    <form id="code-form" class="code-form" hidden>
      <label for="code">Qual è la parola segreta?</label>
      <div class="code-row">
        <input id="code" name="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <button type="submit">Entra</button>
      </div>
      <p class="code-error" id="code-error" role="alert"></p>
    </form>
  </main>

  <!-- Schermata 2: il calendario -->
  <main id="calendar" class="screen calendar" hidden>
    <div id="preview-bar" class="preview-bar" hidden>
      Anteprima admin del <input type="date" id="preview-date" min="2026-11-25" max="2026-12-26">
    </div>
    <header class="cal-head">
      <p class="per">Per</p>
      <h1 class="name"><span id="her-name">Olly</span><span class="heart" data-heart></span></h1>
      <div class="divider"><span></span><i data-bow></i><span></span></div>
      <p class="subtitle">Il tuo calendario dell'Avvento <span>♡</span></p>
      <p class="intro-text" id="intro-text"></p>
      <p class="signature" id="signature"></p>
      <p class="status"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span id="status"></span></p>
    </header>
    <section class="grid" id="grid" aria-label="Caselle dal 1 al 24 dicembre"></section>
    <div class="ground" aria-hidden="true"></div>
  </main>

  <!-- Finestra della sorpresa -->
  <dialog id="surprise" class="surprise">
    <article class="sheet">
      <button class="close" type="button" aria-label="Chiudi">×</button>
      <span class="sprig-deco" data-holly></span>
      <p class="s-date"><span id="s-date"></span></p>
      <h2 id="s-title"></h2>
      <div class="sheet-bow" data-bow></div>
      <div id="s-body"></div>
      <span class="seal" aria-hidden="true">♥</span>
    </article>
    <nav class="day-nav" aria-label="Altri giorni">
      <button id="s-prev" type="button" aria-label="Giorno prima">‹</button>
      <span id="s-count"></span>
      <button id="s-next" type="button" aria-label="Giorno dopo">›</button>
    </nav>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="config.js?v=20261128a"></script>
  <script src="decor.js?v=20261128a"></script>
  <script src="app.js?v=20261128a"></script>
</body>
</html>
